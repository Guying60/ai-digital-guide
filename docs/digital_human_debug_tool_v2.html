<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字人 WS 调试工具</title>
<style>
:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --text:    #c9d1d9;
  --dim:     #8b949e;
  --green:   #3fb950;
  --red:     #f85149;
  --yellow:  #d29922;
  --blue:    #58a6ff;
  --orange:  #ffa657;
  --purple:  #bc8cff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', Consolas, 'Liberation Mono', monospace;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Toolbar ── */
.toolbar {
  height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
}
.toolbar h1 { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
  transition: background .3s;
}
.dot.on { background: var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#connLabel { font-size: 12px; color: var(--dim); }
.toolbar-right { margin-left: auto; font-size: 11px; color: var(--dim); }

/* ── Layout ── */
.body {
  flex: 1;
  display: grid;
  grid-template-columns: 480px 1fr;
  overflow: hidden;
  min-height: 0;
}

/* ── Left: Video ── */
.left {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: #000;
  overflow: hidden;
}
#canvas {
  flex: 1;
  width: 100%;
  display: block;
  object-fit: contain;
  min-height: 0;
}
.placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--dim);
}
.placeholder svg { opacity: .3; }
.placeholder p { font-size: 12px; }
.stats-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 7px 14px;
  display: flex;
  gap: 20px;
  flex-shrink: 0;
}
.stat { font-size: 11px; color: var(--dim); }
.stat b { color: var(--text); font-weight: 600; }

/* ── Right: Controls + Log ── */
.right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  min-height: 0;
}
.panel {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--dim);
  margin-bottom: 9px;
}

/* ── Form ── */
input, textarea, select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  border-radius: 6px;
  padding: 5px 9px;
  transition: border-color .15s;
}
input:focus, textarea:focus { outline: none; border-color: var(--blue); }
input::placeholder, textarea::placeholder { color: var(--dim); }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.row:last-child { margin-bottom: 0; }
.f1 { flex: 1; min-width: 0; }
textarea { width: 100%; height: 60px; resize: vertical; }

/* ── Buttons ── */
button {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  transition: opacity .12s, filter .12s;
}
button:hover:not(:disabled) { filter: brightness(1.15); }
button:active:not(:disabled) { filter: brightness(.9); }
button:disabled { opacity: .38; cursor: default; }
.btn-primary  { background: var(--blue);   border-color: var(--blue);   color: #000; font-weight: 600; }
.btn-danger   { background: var(--red);    border-color: var(--red);    color: #fff; font-weight: 600; }
.btn-warn     { background: var(--yellow); border-color: var(--yellow); color: #000; }
.btn-ghost    { background: transparent;   color: var(--dim); }
.btn-sm       { padding: 3px 9px; font-size: 11px; }

/* ── Chips ── */
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.chip {
  padding: 2px 9px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--dim);
  font-size: 11px;
  cursor: pointer;
  transition: border-color .12s, color .12s;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }

/* ── Log ── */
.log-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}
.log-head {
  position: sticky;
  top: 0;
  padding: 6px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 1;
}
.log-head span {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--dim);
}
#logBody { padding: 3px 0; font-size: 11px; line-height: 1.65; }
.le {
  display: flex;
  gap: 6px;
  padding: 1px 14px;
}
.le:hover { background: rgba(255,255,255,.03); }
.le-t { color: var(--dim); flex-shrink: 0; width: 90px; }
.le-k { flex-shrink: 0; width: 46px; font-weight: 700; }
.le-k.INFO { color: var(--blue);   }
.le-k.RECV { color: var(--green);  }
.le-k.SEND { color: var(--yellow); }
.le-k.VID  { color: var(--purple); }
.le-k.AUD  { color: var(--orange); }
.le-k.ERR  { color: var(--red);    }
.le-k.WARN { color: var(--yellow); }
.le-m { color: var(--text); word-break: break-all; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Audio meter ── */
.meter-wrap {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 6px;
}
.meter-bar {
  height: 100%;
  width: 0%;
  background: var(--orange);
  border-radius: 2px;
  transition: width .08s linear;
}
</style>
</head>
<body>

<header class="toolbar">
  <div class="dot" id="dot"></div>
  <h1>数字人 WebSocket 调试工具 (Jitter Buffer + Bitmap Decode)</h1>
  <span id="connLabel">未连接</span>
  <div class="toolbar-right" id="clockLabel"></div>
</header>

<div class="body">

  <div class="left">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      <p>等待视频帧…</p>
      <p style="font-size:10px">连接后将在此显示 MuseTalk JPEG 帧</p>
    </div>
    <canvas id="canvas" style="display:none"></canvas>
    <div class="stats-bar">
      <div class="stat">网络接收帧率 <b id="sFps">0</b></div>
      <div class="stat">接收总帧数 <b id="sVid">0</b></div>
      <div class="stat">解码完成帧数 <b id="sDec">0</b></div>
      <div class="stat">音频块 <b id="sAud">0</b></div>
      <div class="stat">当前句 <b id="sSid">—</b></div>
      <div class="stat">缓冲队列 <b id="sBuf">0</b> 帧</div>
    </div>
  </div>

  <div class="right">

    <div class="panel">
      <div class="panel-label">连接配置</div>
      <div class="row">
        <input class="f1" id="iUrl" type="text"
               value="wss://ai.guying.xyz/ai-project/chat"
               placeholder="WebSocket URL">
      </div>
      <div class="row">
        <input style="width:200px" id="iAid" type="text"
               value="2046935279750139906" placeholder="attractionId *">
        <input class="f1" id="iTok" type="text"
               placeholder="JWT Token（不含 Bearer 前缀）">
        <input style="width:68px" id="iSr" type="number"
               value="16000" title="CosyVoice PCM 采样率 Hz" placeholder="采样率">
      </div>
      <div class="row">
        <button class="btn-primary" id="btnConn" onclick="doConnect()">连接</button>
        <button class="btn-danger"  id="btnDisc" onclick="doDisconnect()" disabled>断开</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">发送消息</div>
      <div class="chips">
        <button class="chip" onclick="preset('chat')">💬 发起对话</button>
        <button class="chip" onclick="preset('interrupt')">✋ 打断</button>
        <button class="chip" onclick="preset('startAsr')">🎙 开始 ASR</button>
        <button class="chip" onclick="preset('stopAsr')">⏹ 停止 ASR</button>
        <button class="chip" onclick="preset('ping')">🏓 ping</button>
        <button class="chip" onclick="preset('')">✕ 清空</button>
      </div>
      <textarea id="iMsg" placeholder='{"type": "chat", "content": "你好，请介绍一下这个景区"}'></textarea>
      <div class="row" style="margin-top:7px">
        <button class="btn-primary" onclick="sendMsg()">发送 JSON ↑</button>
        <button class="btn-warn"    onclick="doInterrupt()">✋ 立即打断</button>
        <button class="btn-ghost btn-sm" onclick="resetAudio()" title="重置音频调度基线">重置音频</button>
        <button class="btn-ghost btn-sm" onclick="clearVideo()"  title="清空画面">清空画面</button>
      </div>
      <div class="meter-wrap"><div class="meter-bar" id="meterBar"></div></div>
    </div>

    <div class="log-wrap">
      <div class="log-head">
        <span>日志</span>
        <button class="btn-ghost btn-sm" onclick="clearLog()">清空</button>
      </div>
      <div id="logBody"></div>
    </div>

  </div></div>

<script>
// ═══════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════
let ws           = null;
let audioCtx     = null;
let nextAudioAt  = 0;
let analyser     = null;
let totalVid     = 0;
let totalDec     = 0;
let totalAud     = 0;
let fpsCount     = 0;
let fpsTimer     = null;
let meterTimer   = null;

// 记录每个句子的音频墙钟基准点（AudioContext 轴坐标）
let sentenceAudioOrigins = {};

// 视频渲染缓冲区：存放 { sid, ptsMs, bitmap }
let videoBuffer    = [];
let isRendering    = false; 

// 解码队列：先把 WebSocket 进来的 JPEG 放到这里，避免频繁 new Image
let decodeQueue    = [];
let decoding       = false;
let decodeStartAt  = 0;

const canvas  = document.getElementById('canvas');
const ctx2d   = canvas.getContext('2d');
const ph      = document.getElementById('placeholder');

// 队列上限控制
const VIDEO_BUFFER_MAX = 15;  // ~0.6s 视频，PTS 渲染不需要大缓冲
const DECODE_QUEUE_MAX = 30;

// ═══════════════════════════════════════════════════════════
//  Clock
// ═══════════════════════════════════════════════════════════
setInterval(() => {
  const n = new Date();
  document.getElementById('clockLabel').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
}, 1000);

// ═══════════════════════════════════════════════════════════
//  Connection
// ═══════════════════════════════════════════════════════════
function doConnect() {
  const url  = document.getElementById('iUrl').value.trim();
  const aid  = document.getElementById('iAid').value.trim();
  const tok  = document.getElementById('iTok').value.trim();
  const sr   = parseInt(document.getElementById('iSr').value) || 22050;

  if (!url || !aid) { log('ERR', 'URL 和 attractionId 不能为空'); return; }

  let wsUrl = `${url}?attractionId=${encodeURIComponent(aid)}`;
  if (tok) wsUrl += `&token=${encodeURIComponent(tok)}`;

  log('INFO', `→ 连接 ${wsUrl}`);

  audioCtx    = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: sr });
  nextAudioAt = 0;
  sentenceAudioOrigins = {}; 

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.connect(audioCtx.destination);
  startMeter();

  fpsCount = 0;
  fpsTimer = setInterval(() => {
    document.getElementById('sFps').textContent = fpsCount;
    fpsCount = 0;
  }, 1000);

  // 确保 PTS 驱动的渲染循环启动
  if (!isRendering) {
    isRendering = true;
    requestAnimationFrame(renderLoop);
  }

  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setConn(true, '已连接');
    document.getElementById('btnConn').disabled = true;
    document.getElementById('btnDisc').disabled = false;
    log('INFO', '✅ WebSocket 连接成功');
  };
  
  ws.onclose = e => {
    setConn(false, `已断开 (${e.code})`);
    document.getElementById('btnConn').disabled = false;
    document.getElementById('btnDisc').disabled = true;

    clearInterval(fpsTimer);
    clearInterval(meterTimer);
    
    isRendering = false;
    clearVideoBuffer();
    decodeQueue = [];
    decoding = false;
    sentenceAudioOrigins = {};

    document.getElementById('sBuf').textContent = '0';
    document.getElementById('meterBar').style.width = '0%';

    log('WARN', `连接关闭  code=${e.code}  reason=${e.reason || '—'}`);
  };
  ws.onerror = () => log('ERR', 'WebSocket 错误');
  ws.onmessage = onMsg;
}

function doDisconnect() {
  ws?.close(1000, 'manual');
  ws = null;
}

// ═══════════════════════════════════════════════════════════
//  Message Dispatch
// ═══════════════════════════════════════════════════════════
function onMsg(e) {
  typeof e.data === 'string' ? onText(e.data) : onBinary(e.data);
}

function onText(raw) {
  let msg;
  try { msg = JSON.parse(raw); }
  catch { log('RECV', `(非 JSON) ${raw.slice(0, 120)}`); return; }

  const t = msg.type ?? '?';
  switch (t) {
    case 'ready':
      log('RECV', '🎬 MuseTalk 已就绪 (ready)');
      break;
    case 'done':
      log('RECV', `✅ 句子完成  sentence_id=${msg.sentence_id ?? '?'}`);
      document.getElementById('sSid').textContent = `✅ ${msg.sentence_id ?? '?'}`;
      // done 只表示视频帧传输完毕，音频还在播放。
      // onAudioFrame 内部的 nextAudioAt 链式调度已保证句子间音频顺序播放，
      // 重置 nextAudioAt=0 会破坏这个链，导致前后两句音频重叠。
      break;
    case 'ping':
      sendRaw(JSON.stringify({ type: 'pong' }));
      log('RECV', '🏓 ping → 已回 pong');
      break;
    default:
      log('RECV', `[${t}] ${raw.slice(0, 150)}`);
  }
}

function onBinary(ab) {
  if (ab.byteLength < 7) { log('WARN', `帧过短: ${ab.byteLength}B`); return; }
  const dv  = new DataView(ab);
  const tag = dv.getUint8(0);
  const sid = dv.getUint16(1, false);
  const pts = dv.getUint32(3, false);
  const pay = ab.slice(7);

  if      (tag === 0x01) onAudioFrame(sid, pts, pay);
  else if (tag === 0x02) onVideoFrame(sid, pts, pay);
  else log('WARN', `未知帧 tag=0x${tag.toString(16).padStart(2,'0')}`);
}

// ═══════════════════════════════════════════════════════════
//  Audio
// ═══════════════════════════════════════════════════════════
function onAudioFrame(sid, ptsMs, pcmAb) {
  totalAud++;
  document.getElementById('sAud').textContent = totalAud;

  if (!audioCtx || pcmAb.byteLength === 0) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const int16  = new Int16Array(pcmAb);
  const audioBuf = audioCtx.createBuffer(1, int16.length, audioCtx.sampleRate);
  const ch     = audioBuf.getChannelData(0);
  for (let i = 0; i < int16.length; i++) ch[i] = int16[i] / 32768;

  const src = audioCtx.createBufferSource();
  src.buffer = audioBuf;
  src.connect(analyser);

  const now   = audioCtx.currentTime;
  const start = Math.max(now + 0.03, nextAudioAt);
  src.start(start);
  nextAudioAt = start + audioBuf.duration;
  
  // 锚定该句音频在 AudioContext 时间轴上的绝对零点
  if (sentenceAudioOrigins[sid] === undefined) {
    sentenceAudioOrigins[sid] = start - (ptsMs / 1000.0);
  }

  if (totalAud % 5 === 1) {
    const ms = (int16.length / audioCtx.sampleRate * 1000).toFixed(0);
    log('AUD', `音频帧 sid=${sid} pts=${ptsMs}ms  ${int16.length} samples (${ms}ms)`);
  }
}

function startMeter() {
  const data = new Uint8Array(analyser?.fftSize ?? 256);
  meterTimer = setInterval(() => {
    if (!analyser) return;
    analyser.getByteTimeDomainData(data);
    let max = 0;
    for (const v of data) { const a = Math.abs(v - 128); if (a > max) max = a; }
    document.getElementById('meterBar').style.width = Math.min(100, max / 128 * 100 * 3) + '%';
  }, 80);
}

function resetAudio() {
  nextAudioAt = 0;
  sentenceAudioOrigins = {};
  log('INFO', '音频调度基线已重置');
}

// ═══════════════════════════════════════════════════════════
//  Video (PTS Sync Rendering Loop)
// ═══════════════════════════════════════════════════════════

// PTS 驱动渲染循环：
//   - 每 rAF tick 最多取一帧渲染（不连续 shift 丢弃中间帧）
//   - 落后时以 60fps 追赶 25fps 视频 → ~2.4x 平滑快进，无跳帧
//   - origin 未锚定时立即渲染兜底，不阻塞后续帧
//   - 无条件缓冲上限防止内存堆积
function renderLoop() {
  if (!isRendering) return;
  requestAnimationFrame(renderLoop);

  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  document.getElementById('sBuf').textContent = videoBuffer.length;

  // 无条件缓冲上限：超过 VIDEO_BUFFER_MAX 就丢弃最旧帧
  while (videoBuffer.length > VIDEO_BUFFER_MAX) {
    const dropped = videoBuffer.shift();
    closeBitmap(dropped.bitmap);
  }

  let frameToRender = null;

  if (videoBuffer.length > 0) {
    const frame = videoBuffer[0];
    const origin = sentenceAudioOrigins[frame.sid];

    if (origin === undefined) {
      // 音频 origin 未锚定：立即渲染该帧（兜底），不阻塞后续帧
      frameToRender = videoBuffer.shift();
    } else {
      const targetTime = origin + (frame.ptsMs / 1000.0);
      if (now >= targetTime) {
        // 该帧已到达或超过播放时刻 → 取出一帧渲染
        frameToRender = videoBuffer.shift();
      }
      // else: 帧属于未来 → 本 tick 不渲染，等待
    }
  }

  if (frameToRender) {
    try {
      ctx2d.drawImage(frameToRender.bitmap, 0, 0);
    } catch (err) {
      // 屏蔽极其罕见的关闭状态绘制异常
    }
    closeBitmap(frameToRender.bitmap);
  }
}

function pumpDecodeQueue() {
  if (decoding) return;
  if (decodeQueue.length === 0) return;

  decoding = true;
  decodeStartAt = performance.now();

  const job = decodeQueue.shift();
  const { sid, ptsMs, jpegBlob } = job;

  while (decodeQueue.length > DECODE_QUEUE_MAX) {
    decodeQueue.shift();
  }

  createImageBitmap(jpegBlob)
    .then(bitmap => {
      totalDec++;
      document.getElementById('sDec').textContent = totalDec;

      if (ph.style.display !== 'none') {
        ph.style.display = 'none';
        canvas.style.display = 'block';
      }

      if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
      }

      videoBuffer.push({ sid, ptsMs, bitmap });

      if (totalDec % 30 === 1) {
        const cost = (performance.now() - decodeStartAt).toFixed(1);
        log('VID', `解码完成 sid=${sid} pts=${ptsMs}ms, 耗时=${cost}ms, 缓冲=${videoBuffer.length} 帧`);
      }
    })
    .catch(err => {
      log('ERR', `JPEG 解码失败 sid=${sid} pts=${ptsMs}ms: ${err?.message || err}`);
    })
    .finally(() => {
      decoding = false;
      pumpDecodeQueue();
    });
}

function onVideoFrame(sid, ptsMs, jpegAb) {
  totalVid++;
  fpsCount++;
  document.getElementById('sVid').textContent = totalVid;

  const jpegBlob = new Blob([new Uint8Array(jpegAb)], { type: 'image/jpeg' });

  decodeQueue.push({ sid, ptsMs, jpegBlob });

  while (decodeQueue.length > DECODE_QUEUE_MAX) {
    decodeQueue.shift();
  }

  pumpDecodeQueue();

  if (totalVid % 30 === 1) {
    log('VID', `收到视频帧 sid=${sid} pts=${ptsMs}ms, 解码队列=${decodeQueue.length}, 播放缓冲=${videoBuffer.length}`);
  }
}

function clearVideoBuffer() {
  for (const item of videoBuffer) {
    closeBitmap(item.bitmap);
  }
  videoBuffer = [];
}

function closeBitmap(bmp) {
  if (bmp && typeof bmp.close === 'function') {
    try { bmp.close(); } catch {}
  }
}

// 彻底重置画面状态，不摧毁 RAF 渲染主循环结构
function clearVideo() {
  ph.style.display = 'flex';
  canvas.style.display = 'none';
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);

  totalVid = 0;
  totalDec = 0;

  clearVideoBuffer();
  decodeQueue = [];
  decoding = false;

  document.getElementById('sVid').textContent = '0';
  document.getElementById('sDec').textContent = '0';
  document.getElementById('sFps').textContent = '0';
  document.getElementById('sSid').textContent = '—';
  document.getElementById('sBuf').textContent = '0';
}

// ═══════════════════════════════════════════════════════════
//  Send
// ═══════════════════════════════════════════════════════════
function sendMsg() {
  const text = document.getElementById('iMsg').value.trim();
  if (text) sendRaw(text);
}

function doInterrupt() {
  sendRaw(JSON.stringify({ type: 'interrupt' }));
  nextAudioAt = 0;
  sentenceAudioOrigins = {}; 

  clearVideoBuffer();
  decodeQueue = [];
  decoding = false;
  
  document.getElementById('sBuf').textContent = '0';
  log('WARN', '已发送打断，音频基线和视频缓冲区已重置');
}

function sendRaw(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log('ERR', '未连接，无法发送');
    return;
  }
  ws.send(text);
  log('SEND', `↑ ${text.slice(0, 120)}`);
}

// ═══════════════════════════════════════════════════════════
//  Presets
// ═══════════════════════════════════════════════════════════
const PRESETS = {
  chat:     '{"type": "chat", "content": "你好，请介绍一下这个景区"}',
  interrupt:'{"type": "interrupt"}',
  startAsr: '{"type": "start_recognition"}',
  stopAsr:  '{"type": "stop_recognition"}',
  ping:     '{"type": "ping"}',
};
function preset(k) {
  document.getElementById('iMsg').value = PRESETS[k] ?? '';
}

// ═══════════════════════════════════════════════════════════
//  UI Helpers
// ═══════════════════════════════════════════════════════════
function setConn(on, label) {
  document.getElementById('dot').className = on ? 'dot on' : 'dot';
  document.getElementById('connLabel').textContent = label;
}

function log(kind, msg) {
  const area = document.getElementById('logBody');
  const n    = new Date();
  const ts   = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}.${String(n.getMilliseconds()).padStart(3,'0')}`;
  const el   = document.createElement('div');
  el.className = 'le';
  el.innerHTML =
    `<span class="le-t">${ts}</span>` +
    `<span class="le-k ${kind}">${kind}</span>` +
    `<span class="le-m">${esc(msg)}</span>`;
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
  while (area.childElementCount > 400) area.removeChild(area.firstChild);
}

function clearLog() { document.getElementById('logBody').innerHTML = ''; }
function pad(n)     { return String(n).padStart(2, '0'); }
function esc(s)     { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Init ──
log('INFO', '已升级同步机制：废弃定频渲染，采用 AudioContext 时间轴与 PTS 顺畅丢帧机制，彻底解决画面闪烁与抽搐。');
log('INFO', '协议：0x01=CosyVoice音频  0x02=MuseTalk视频帧  (7B header: tag+sid+pts)');
</script>
