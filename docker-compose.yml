services:
  mysql-dev:
    image: mysql:latest
    container_name: mysql-dev
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: MySql_Secur3_P@ss!2026
    # 【优化：全面限制全局和线程级内存，并关闭不必要的缓存】
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --max-connections=20
      --key-buffer-size=8M
      --sort-buffer-size=512K
      --join-buffer-size=512K
      --read-buffer-size=256K
      --read-rnd-buffer-size=256K
      --performance-schema=OFF
    # 【优化：使用 v2 格式的硬限制，确保普通 docker-compose 也能生效】
    mem_limit: 450M
    volumes:
      - ./mysql_data:/var/lib/mysql

  redis-dev:
    image: redis/redis-stack:latest
    container_name: redis-dev
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      # 【修改：追加 --maxmemory 限制 Redis 占用】
      - REDIS_ARGS=--requirepass R3dis_St@ck_S3cure!2026 --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    deploy:
      resources:
        limits:
          memory: 400M
    volumes:
      - ./redis_data:/data

  rabbitmq-dev:
    image: rabbitmq:management
    container_name: rabbitmq-dev
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rmq_super_admin
      RABBITMQ_DEFAULT_PASS: R@bbit_Adm1n_!2026
      # 【新增：内存水位线，超过 300MB 就不再接收新消息】
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.15"
    deploy:
      resources:
        limits:
          memory: 400M
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./plugins/rabbitmq_delayed_message_exchange-4.2.0.ez:/plugins/rabbitmq_delayed_message_exchange-4.2.0.ez
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_delayed_message_exchange && docker-entrypoint.sh rabbitmq-server"
      
  markitdown-worker:
    build: ./markitdown-worker
    container_name: markitdown-worker
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq-dev
      RABBITMQ_USER: rmq_super_admin
      RABBITMQ_PASS: R@bbit_Adm1n_!2026
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      - rabbitmq-dev

volumes:
  rabbitmq_data: